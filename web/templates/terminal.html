<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>远程终端</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/view/admin/static/css/terminal.css?v=20261009f">
<script src="/view/admin/config.js"></script>
<script src="/view/admin/socket.io.js"></script>
</head>
<body>
  <div id="term-bar">
    <span id="term-title">远程终端</span>
    <span id="term-dev" class="term-dev"></span>
    <span id="term-state" class="term-state">连接中…</span>
    <button id="term-close">关闭终端</button>
  </div>
  <div id="term-out" class="term-out"></div>
  <div class="term-input-row">
    <span class="term-prompt">&gt;</span>
    <input id="term-input" autocomplete="off" spellcheck="false" placeholder="输入命令后回车（会话保持，cd/变量持久）">
  </div>
  <script src="/view/admin/static/js/terminal.js?v=20261009k"></script>
</body>
</html>
