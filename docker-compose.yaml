# mochi-oa-server-go 一键启动（ubuntu 基础镜像直接执行二进制 + mysql 8.0）
#
# 启动流程：
#   1) ./build.ps1           交叉编译 -> dist/mochi-oa-server_linux_amd64
#   2) ./start.ps1 停掉现有容器
#   3) docker compose up -d
#   4) docker compose logs -f app
#   （./start.ps1 把 1~4 串成一条命令）
#
# 全新服务器：库和表由服务端自己按模型创建（GORM AutoMigrate），
#   不依赖任何老库、不依赖任何初始化 SQL。MySQL 账号只要有 CREATE 权限即可。
#
# 网络：
#   - app 与 mysql 在同一个 compose 网络，app 用【容器名/服务名】连 mysql：
#     MYSQL_HOST=mochi-oa-server-go-mysql-c54f8e4（见 .env，compose 里也再显式覆盖一次）。
#   - mysql 对外 open 3306（宿主机可用客户端直连调试；换宿主机端口改 MYSQL_HOST_PORT）。
#   - app 对外 open ${SERVER_PORT:-3001}。

services:
  mochi-oa-server-go-app-c54f8e4:
    # 用本仓库的 Dockerfile 构一个「debian + ca-certificates + tzdata」的运行时镜像。
    # 不能直接用 debian/ubuntu 官方镜像：它们都不带 ca-certificates，容器里没有 /etc/ssl，
    # 出站 HTTPS 会全部报 x509: certificate signed by unknown authority（CF ICE / 爱发电 / SMTP TLS）。
    build:
      context: .
      dockerfile: Dockerfile
    image: mochi-oa-server-go-app:bookworm
    container_name: mochi-oa-server-go-app-c54f8e4
    working_dir: /app
    # 二进制仍由下面的 volume 挂载进来，entrypoint 直接执行它（PID 1，SIGTERM 正常）
    command: ["/app/mochi-oa-server_linux_amd64"]
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-80}
      STORAGE: mysql
      # 容器内必须用服务名/容器名，不能写 127.0.0.1
      MYSQL_HOST: mochi-oa-server-go-mysql-c54f8e4
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mochioa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      FILE_DIR: /app/data
      TZ: Asia/Shanghai
      # 全新服务器：库不存在就建库，表按 GORM 模型自动建/补
      AUTO_CREATE_DATABASE: "true"
      AUTO_MIGRATE: "true"
       
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 服务器管理员（SERVER_ADMIN）：逗号分隔用户名，基于用户、与公司/群角色无关；留空回退 ADMIN_USER
      SERVER_ADMIN_USERS: ${SERVER_ADMIN_USERS:-}
      # 主邮件（环境级，第一优先级）：配置了 MAIL_HOST 即启用；未配则由客户端(SERVER_ADMIN)在设置里写入
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}

      # ICE CONFIG
      ICE_SERVERS: ${ICE_SERVERS:-}
      ICE_USE_CLOUDFLARE: ${ICE_USE_CLOUDFLARE:-false}
      CLOUDFLARE_TURN_TOKEN: ${CLOUDFLARE_TURN_TOKEN:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      ICE_SERVERS_TOKEN_SECOND: ${ICE_SERVERS_TOKEN_SECOND:-86400}

      # 出网代理（HTTP+SOCKS5）监听与对外地址
      PROXY_ENABLED: ${PROXY_ENABLED:-false}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT:-8080}
      PROXY_SOCKS5_PORT: ${PROXY_SOCKS5_PORT:-1080}
      PROXY_HOST: ${PROXY_HOST:-}

      # LiveKit SFU（视频会议/远程查看统一走 SFU；密钥只存服务端，绝不下发给客户端）
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-oa}
    ports:
      - "${SERVER_PORT:-3000}:${PORT:-80}"
      # 出网代理映射到宿主机（默认 HTTP 8080 / SOCKS5 1080）
      - "${PROXY_HTTP_PORT:-8080}:${PROXY_HTTP_PORT:-8080}"
      - "${PROXY_SOCKS5_PORT:-1080}:${PROXY_SOCKS5_PORT:-1080}"
    volumes:
      - ./dist:/app
      - ./data/oa-data:/app/data
    depends_on:
      mochi-oa-server-go-mysql-c54f8e4:
        condition: service_healthy
    restart: unless-stopped

  mochi-oa-server-go-mysql-c54f8e4:
    image: mysql:8.0
    container_name: mochi-oa-server-go-mysql-c54f8e4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      # 故意不设 MYSQL_DATABASE：库不存在，交给服务端自己创建（全新服务器场景）。
      # 若想让镜像先建空库，放开下一行；服务端 AutoMigrate 仍会补表。
      # MYSQL_DATABASE: ${MYSQL_DATABASE:-mochioa}
    # ports:
    #   - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./data/mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
